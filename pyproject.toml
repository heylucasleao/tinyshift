[project]
name = "tinyshift"
version = "1.4.1"
description = "A small toolbox for mlops"
license = { text = "MIT" }
authors = [{ name = "Lucas Leão", email = "heylucasleao@gmail.com" }]
readme = "README.md"
keywords = ["mlops", "toolbox", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "pandas>2.3.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "scikit-learn>1.3.0",
    "statsmodels>=0.14.5",
]

[project.optional-dependencies]
series = [
    "statsforecast>=1.4.0",
    "mlforecast>=0.7.0",
    "utilsforecast>=0.1.0",
]

plot = [
    "plotly>5.22.0",
    "kaleido<=0.2.1",
]

notebook = [
    "nbformat>=5.10.4",
    "ipykernel>6.7.0",
]

all = [
    "tinyshift[series,plot,notebook]",
]

dev = [
    "tinyshift[all]",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]